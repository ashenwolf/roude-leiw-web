<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="circle">
      <circle cx="16" cy="16" r="14"/>
    </clipPath>
  </defs>
  <!-- Luxembourgish flag colors in a circle -->
  <g clip-path="url(#circle)">
    <!-- Red stripe (top) -->
    <rect x="0" y="2" width="32" height="9.33" fill="#EF3340"/>
    <!-- White stripe (middle) -->
    <rect x="0" y="11.33" width="32" height="9.33" fill="#FFFFFF"/>
    <!-- Light blue stripe (bottom) -->
    <rect x="0" y="20.66" width="32" height="9.34" fill="#00A3E0"/>
  </g>
  <!-- Circle outline for better visibility -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#666666" stroke-width="0.5"/>
</svg>
